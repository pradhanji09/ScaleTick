version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: scaletick-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: scaletick-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
